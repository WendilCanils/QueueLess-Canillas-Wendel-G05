{% extends "base.html" %}
{% block title %}Delete Ticket | QueueLess{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h2 class="h4 mb-3">Delete ticket {{ ticket.code }}?</h2>
        <p class="text-muted">This removes the ticket from your history. This cannot be undone.</p>
        <form method="post">
          {% csrf_token %}
          <button type="submit" class="btn btn-danger">Yes, delete</button>
          <a href="{{ ticket.get_absolute_url }}" class="btn btn-outline-secondary">Keep it</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
