<form method="get" class="row g-2 mb-3">
  <div class="col-sm-4">
    <select name="status" class="form-select">
      <option value="">All statuses</option>
      {% for value, label in status_choices %}
        <option value="{{ value }}" {% if value == current_status %}selected{% endif %}>{{ label }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="col-sm-4"><input type="date" name="date" value="{{ current_date }}" class="form-control"></div>
  <div class="col-sm-4">
    <button type="submit" class="btn btn-outline-primary">Filter</button>
    <a href="{{ request.path }}" class="btn btn-link">Reset</a>
  </div>
</form>
