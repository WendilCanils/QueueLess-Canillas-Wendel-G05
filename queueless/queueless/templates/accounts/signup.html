{% extends "base.html" %}
{% block title %}Sign up | QueueLess{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h2 class="h4 mb-4 text-center">Create your account</h2>
        <form method="post" novalidate>
          {% csrf_token %}
          {% include "accounts/_form_fields.html" %}
          <button type="submit" class="btn btn-primary w-100">Sign up</button>
        </form>
        <p class="text-center mt-3 mb-0">Already have an account? <a href="{% url 'login' %}">Log in</a></p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
